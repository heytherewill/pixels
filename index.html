---
layout: main
---

{% for post in paginator.posts %}
  {% assign thumbnail_url = "/assets/img/" | append: post.resource | append: "." | append: post.extension | prepend: site.baseurl %}
  <div class="chapter">
    <a href="{{post.url | prepend: site.baseurl}}">
      <img src="{{ thumbnail_url }}" alt="{{ post.title | escape }}" decoding="async"{% if forloop.first %} fetchpriority="high"{% else %} loading="lazy"{% endif %}>
    </a>
    <a href="{{post.url | prepend: site.baseurl}}">
      <div class="chapter_inner">
        <p class="chapter_number">{{post.date | date: '%Y, %b %d'}}</p>
        <h3 class="chapter_title">{{post.title}}</h3>
      </div>
    </a>
  </div>
{% endfor %}
